<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1b5e3b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Reporta" />
    <link rel="manifest" href="../../manifest.webmanifest" />
    <link rel="apple-touch-icon" href="../../assets/logo.svg" />
    <title>Minhas denúncias · Santarém Reporta</title>
    <link rel="stylesheet" href="../../css/styles.css" />
  </head>
  <body>
    <header class="topo">
      <strong>Minhas denúncias</strong>
      <nav><a href="home.html">Mapa</a></nav>
    </header>
    <main class="container">
      <section class="card">
        <form class="acoes" id="filtros">
          <select name="status">
            <option value="">Todos os status</option>
            <option value="pendente">Pendente</option>
            <option value="em_analise">Em análise</option>
            <option value="em_andamento">Em andamento</option>
            <option value="resolvido">Resolvido</option>
          </select>
          <select name="tipo">
            <option value="">Todos os tipos</option>
            <option value="buraco">Buraco</option>
            <option value="rua">Rua</option>
            <option value="lixo">Lixo</option>
            <option value="iluminacao">Iluminação</option>
            <option value="sinalizacao">Sinalização</option>
            <option value="ambiental">Ambiental</option>
          </select>
        </form>
      </section>
      <div class="lista" id="lista"></div>
    </main>
    <script type="module">
      import "../../js/firebase.js";
      import { proteger, usuarioAtual } from "../../js/auth.js";
      import { listarDoCidadao } from "../../js/denuncias.js";
      proteger(["cidadao"], "login.html");

      let itens = [];
      const lista = document.getElementById("lista");
      const filtros = document.getElementById("filtros");

      function render() {
        const status = filtros.status.value;
        const tipo = filtros.tipo.value;
        const filtrados = itens.filter(
          (d) => (!status || d.status === status) && (!tipo || d.tipo === tipo),
        );
        lista.innerHTML =
          filtrados
            .map(
              (d) => `
        <a class="item" href="detalhe.html?id=${d.id}">
          <div>
            <strong>${d.protocolo}</strong>
            <div>${d.tipo} · ${d.secretaria}</div>
          </div>
          <span class="badge ${d.status}">${d.status}</span>
        </a>
      `,
            )
            .join("") || "<p>Nenhuma denúncia encontrada.</p>";
      }

      lista.textContent = "Carregando…";
      try {
        const user = await usuarioAtual();
        if (!user) {
          lista.textContent = "Faça login de novo.";
        } else {
          itens = await listarDoCidadao(user.uid);
          render();
        }
      } catch (err) {
        console.error(err);
        lista.textContent = "Não deu para carregar. Olhe o console (F12).";
      }
      filtros.onchange = render;
    </script>
    <script src="../../js/pwa.js"></script>
  </body>
</html>
