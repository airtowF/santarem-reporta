<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1b5e3b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Reporta" />
    <link rel="manifest" href="../../manifest.webmanifest" />
    <link rel="apple-touch-icon" href="../../assets/logo.svg" />
    <title>Servidor · Santarém Reporta</title>
    <link rel="stylesheet" href="../../css/styles.css" />
  </head>
  <body>
    <header class="topo">
      <strong>Área da prefeitura</strong>
      <nav><a href="../../index.html">Início</a></nav>
    </header>
    <main class="container">
      <section class="card" style="max-width: 420px; margin: 24px auto">
        <h2>Login do servidor</h2>
        <p>Fila da sua secretaria.</p>
        <form id="form">
          <label>E-mail <input type="email" name="email" required /></label>
          <label>Senha <input type="password" name="senha" required /></label>
          <button class="btn btn-rio" type="submit">Entrar</button>
        </form>
        <p class="aviso" id="erro" hidden></p>
        <p class="aviso">
          Conta de servidor é criada no Firebase, com perfil `servidor` e o
          campo `secretaria`.
        </p>
      </section>
    </main>
    <script type="module">
      import "../../js/firebase.js";
      import { usuarioAtual } from "../../js/auth.js";
      const { auth, signInWithEmailAndPassword, signOut } = window.SR;
      const erro = document.getElementById("erro");
      document.getElementById("form").onsubmit = async (e) => {
        e.preventDefault();
        erro.hidden = true;
        try {
          const fd = new FormData(e.target);
          await signInWithEmailAndPassword(
            auth,
            fd.get("email"),
            fd.get("senha"),
          );
          const user = await usuarioAtual();
          if (user?.perfil !== "servidor") {
            await signOut(auth);
            erro.hidden = false;
            erro.textContent =
              user?.perfil === "admin"
                ? "Conta de admin. Use a porta Admin."
                : "Esta conta não é de servidor.";
            return;
          }
          location.href = "painel-servidor.html";
        } catch (err) {
          erro.hidden = false;
          erro.textContent = err?.message || "Falha no login.";
        }
      };
    </script>
    <script src="../../js/pwa.js"></script>
  </body>
</html>
