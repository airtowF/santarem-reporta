<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1b5e3b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Reporta" />
    <link rel="manifest" href="../../manifest.webmanifest" />
    <link rel="apple-touch-icon" href="../../assets/logo.svg" />
    <title>Atendimento · Santarém Reporta</title>
    <link rel="stylesheet" href="../../css/base.css" />
    <link rel="stylesheet" href="../../css/servidor.css" />
  </head>
  <body>
    <header class="topo">
      <strong id="titulo-topo">Atendimento</strong>
      <nav><a id="voltar-painel" href="painel-servidor.html">Fila</a></nav>
    </header>
    <main class="container">
      <section class="card" id="conteudo">Carregando…</section>
    </main>
    <script type="module">
      import "../../js/firebase.js";
      import { proteger, usuarioAtual } from "../../js/auth.js";
      import { alterarStatus } from "../../js/denuncias.js";
      const { db, doc, getDoc } = window.SR;
      proteger(["servidor", "admin"], "login-servidor.html");
      const quem = await usuarioAtual();
      if (quem?.perfil === "admin") {
        document.getElementById("titulo-topo").textContent = "Admin · denúncia";
        document.getElementById("voltar-painel").textContent = "Dashboard";
        document.getElementById("voltar-painel").href =
          "../admin/painel-admin.html";
      }
      const id = new URLSearchParams(location.search).get("id");
      const snap = await getDoc(doc(db, "denuncias", id));
      const d = snap.data();
      document.getElementById("conteudo").innerHTML = `
      <p><strong>${d.protocolo}</strong> · ${d.secretaria}</p>
      ${d.fotoUrl ? `<img src="${d.fotoUrl}" alt="" />` : ""}
      ${d.endereco ? `<p>${d.endereco}</p>` : ""}
      <p>${d.descricao}</p>
      ${d.fotoConsertoUrl ? `<p><strong>Foto do conserto</strong></p><img src="${d.fotoConsertoUrl}" alt="Foto do conserto" />` : ""}
      <form id="status">
        <label>Status
          <select name="status" id="select-status">
            <option value="pendente">pendente</option>
            <option value="em_analise">em_analise</option>
            <option value="em_andamento">em_andamento</option>
            <option value="resolvido">resolvido</option>
          </select>
        </label>
        <label id="campo-conserto" hidden>
          Foto do conserto
          <input type="file" name="fotoConserto" accept="image/*" />
        </label>
        <button class="btn btn-primario" type="submit">Atualizar status</button>
      </form>
      <p class="aviso" id="erro-status" hidden></p>
      <p><a class="btn btn-rio" href="chat-servidor.html?id=${id}">Abrir chat</a></p>
    `;
      document.querySelector("[name=status]").value = d.status;
      const campoConserto = document.getElementById("campo-conserto");
      const selectStatus = document.getElementById("select-status");
      const erroStatus = document.getElementById("erro-status");
      function atualizarCampoFoto() {
        campoConserto.hidden = selectStatus.value !== "resolvido";
      }
      selectStatus.onchange = atualizarCampoFoto;
      atualizarCampoFoto();
      document.getElementById("status").onsubmit = async (e) => {
        e.preventDefault();
        erroStatus.hidden = true;
        const user = await usuarioAtual();
        const fd = new FormData(e.target);
        const status = fd.get("status");
        const foto = fd.get("fotoConserto");
        if (status === "resolvido" && !(foto && foto.size)) {
          erroStatus.hidden = false;
          erroStatus.textContent = "Para marcar resolvido, envie a foto do conserto.";
          return;
        }
        await alterarStatus(id, status, user.uid, status === "resolvido" ? foto : null);
        location.reload();
      };
    </script>
    <script src="../../js/pwa.js"></script>
  </body>
</html>
