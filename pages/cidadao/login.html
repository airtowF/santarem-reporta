<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1b5e3b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Reporta" />
    <link rel="manifest" href="../../manifest.webmanifest" />
    <link rel="apple-touch-icon" href="../../assets/logo.svg" />
    <title>Entrar · Santarém Reporta</title>
    <link rel="stylesheet" href="../../css/base.css" />
    <link rel="stylesheet" href="../../css/cidadao.css" />
  </head>
  <body>
    <header class="topo">
      <strong>Santarém Reporta</strong>
      <nav></nav>
    </header>
    <main class="container">
      <section class="card login-box">
        <h2>Entrar como cidadão</h2>
        <form id="form-login">
          <label>E-mail <input type="email" name="email" required /></label>
          <label
            >Senha <input type="password" name="senha" required minlength="6"
          /></label>
          <button class="btn btn-primario" type="submit">Entrar</button>
        </form>
        <p class="login-outras-portas">
          Primeiro acesso? <a href="cadastro.html">Criar conta</a>
        </p>
        <p class="aviso" id="erro" hidden></p>
        <p class="login-outras-portas">
          Sou
          <a href="../servidor/login-servidor.html">Servidor</a>
          ou
          <a href="../admin/login-admin.html">Administrador</a>
        </p>
      </section>
    </main>
    <script type="module">
      import "../../js/firebase.js";
      const { auth, signInWithEmailAndPassword } = window.SR;
      const erro = document.getElementById("erro");
      document.getElementById("form-login").onsubmit = async (e) => {
        e.preventDefault();
        try {
          const fd = new FormData(e.target);
          await signInWithEmailAndPassword(
            auth,
            fd.get("email"),
            fd.get("senha"),
          );
          location.href = "home.html";
        } catch (err) {
          const codigo = err?.code || "";
          erro.hidden = false;
          if (
            codigo === "auth/invalid-credential" ||
            codigo === "auth/wrong-password" ||
            codigo === "auth/user-not-found"
          ) {
            erro.textContent = "E-mail ou senha incorretos.";
          } else {
            erro.textContent = err?.message || "Falha no login.";
          }
        }
      };
    </script>
    <script src="../../js/pwa.js"></script>
  </body>
</html>
